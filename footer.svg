<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
<defs>
<linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7B2CFF"/>
<stop offset="1" stop-color="#00FFD1"/>
</linearGradient>
<mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="200">
<path class="w1" fill="#fff" d="M0 150 C200 120 200 180 400 150 C600 120 600 180 800 150 C1000 120 1000 180 1200 150 C1400 120 1400 180 1600 150 L1600 200 L0 200Z"/>
</mask>
<mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="200">
<path class="w2" fill="#fff" d="M-800 165 C-600 140 -600 190 -400 165 C-200 140 -200 190 0 165 C200 140 200 190 400 165 C600 140 600 190 800 165 L800 200 L-800 200Z"/>
</mask>
</defs>
<style>
.w1{animation:left 9s linear infinite}
.w2{animation:right 12s linear infinite}
@keyframes left{to{transform:translateX(-800px)}}
@keyframes right{to{transform:translateX(800px)}}
.star{animation:tw 2.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.girl{transform-origin:400px 150px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.note{font-size:20px;opacity:0;animation:float 4s ease-in infinite}
@keyframes float{0%{opacity:0;transform:translate(0,0) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translate(24px,-80px) rotate(15deg)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.cup{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.6}50%{opacity:1}}
</style>

<rect width="800" height="200" fill="#000"/>

<circle class="star" cx="60" cy="30" r="2" fill="#fff"/>
<circle class="star" cx="170" cy="55" r="1.5" fill="#00FFD1" style="animation-delay:.6s"/>
<circle class="star" cx="290" cy="25" r="2" fill="#fff" style="animation-delay:1.1s"/>
<circle class="star" cx="520" cy="35" r="1.5" fill="#ff79c6" style="animation-delay:.3s"/>
<circle class="star" cx="640" cy="22" r="2" fill="#fff" style="animation-delay:1.5s"/>
<circle class="star" cx="740" cy="60" r="1.5" fill="#00FFD1" style="animation-delay:.9s"/>

<rect x="0" y="0" width="800" height="200" fill="url(#wg)" mask="url(#m2)" opacity=".5"/>

<rect class="eq" x="140" y="70" width="10" height="80" rx="4" fill="#00FFD1"/>
<rect class="eq" x="160" y="70" width="10" height="80" rx="4" fill="#a970ff" style="animation-delay:.2s"/>
<rect class="eq" x="180" y="70" width="10" height="80" rx="4" fill="#ff79c6" style="animation-delay:.4s"/>
<rect class="eq" x="200" y="70" width="10" height="80" rx="4" fill="#f1fa8c" style="animation-delay:.1s"/>
<rect class="eq" x="220" y="70" width="10" height="80" rx="4" fill="#50fa7b" style="animation-delay:.3s"/>

<rect class="eq" x="570" y="70" width="10" height="80" rx="4" fill="#50fa7b" style="animation-delay:.25s"/>
<rect class="eq" x="590" y="70" width="10" height="80" rx="4" fill="#f1fa8c" style="animation-delay:.05s"/>
<rect class="eq" x="610" y="70" width="10" height="80" rx="4" fill="#ff79c6" style="animation-delay:.35s"/>
<rect class="eq" x="630" y="70" width="10" height="80" rx="4" fill="#a970ff" style="animation-delay:.15s"/>
<rect class="eq" x="650" y="70" width="10" height="80" rx="4" fill="#00FFD1" style="animation-delay:.45s"/>

<g class="girl">
<ellipse cx="400" cy="112" rx="44" ry="50" fill="#ff79c6"/>
<path d="M362 150 Q400 128 438 150 L450 200 L350 200Z" fill="#7B2CFF"/>
<rect x="392" y="128" width="16" height="14" rx="5" fill="#ffe0d0"/>
<circle cx="400" cy="95" r="34" fill="#ffe0d0"/>
<path d="M364 92 Q368 56 400 54 Q432 56 436 92 Q422 72 400 78 Q378 72 364 92Z" fill="#ff79c6"/>
<path d="M376 80 Q384 66 392 78" fill="none" stroke="#ff9ed4" stroke-width="3" stroke-linecap="round"/>
<path d="M385 99 Q390 93 395 99" fill="none" stroke="#3a2342" stroke-width="2.5" stroke-linecap="round"/>
<path d="M405 99 Q410 93 415 99" fill="none" stroke="#3a2342" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="380" cy="108" rx="6" ry="3.5" fill="#ff8fab" opacity=".7"/>
<ellipse cx="420" cy="108" rx="6" ry="3.5" fill="#ff8fab" opacity=".7"/>
<path d="M394 112 Q400 118 406 112" fill="none" stroke="#c0485f" stroke-width="2" stroke-linecap="round"/>
<path d="M362 92 Q362 46 400 46 Q438 46 438 92" fill="none" stroke="#00FFD1" stroke-width="5" stroke-linecap="round"/>
<rect x="353" y="84" width="16" height="30" rx="7" fill="#00FFD1"/>
<rect x="431" y="84" width="16" height="30" rx="7" fill="#00FFD1"/>
<rect class="cup" x="357" y="90" width="8" height="18" rx="4" fill="#7B2CFF"/>
<rect class="cup" x="435" y="90" width="8" height="18" rx="4" fill="#7B2CFF"/>
</g>

<text class="note" x="448" y="70" fill="#00FFD1">♪</text>
<text class="note" x="338" y="76" fill="#ff79c6" style="animation-delay:1s">♫</text>
<text class="note" x="462" y="90" fill="#f1fa8c" style="animation-delay:2s">♬</text>
<text class="note" x="326" y="96" fill="#a970ff" style="animation-delay:3s">♪</text>
<text class="note" x="400" y="40" fill="#50fa7b" style="animation-delay:1.6s">♫</text>

<rect x="0" y="0" width="800" height="200" fill="url(#wg)" mask="url(#m1)"/>
</svg>
