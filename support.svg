<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#00FFD1"/>
<stop offset="1" stop-color="#7B2CFF"/>
</linearGradient>
</defs>
<style>
text{font-family:'Fira Code',Consolas,monospace;font-size:16px;font-weight:600}
.r{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
.box{fill:#0d1117;stroke-width:1.8;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
.e{font-size:24px;font-weight:400;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(8deg)}}
.intro{fill:#c9d1d9;opacity:0;animation:fade 1s ease-out .1s forwards}
@keyframes fade{to{opacity:1}}
.ban{fill:#0d1117;stroke:url(#g);stroke-width:3;stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 3s ease-out 3.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bg{fill:#0d1117;opacity:0;animation:fade .6s ease-out 3.2s forwards}
.tag{font-size:22px;text-anchor:middle;opacity:0;animation:fade .8s ease-out 4s forwards,rainbow 5s linear 4s infinite}
@keyframes rainbow{0%,100%{fill:#00FFD1}25%{fill:#a970ff}50%{fill:#ff79c6}75%{fill:#f1fa8c}}
.sp{opacity:0;animation:rise 4s ease-in infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
</style>

<text class="intro" x="400" y="30" text-anchor="middle">💜 If you like my projects, don't forget to:</text>

<g class="r" style="animation-delay:.4s">
<rect class="box" x="20" y="50" width="760" height="50" rx="12" style="stroke:#f1fa8c"/>
<rect x="20" y="50" width="8" height="50" rx="4" fill="#f1fa8c"/>
<text class="e" x="48" y="83">⭐</text>
<text x="90" y="81" style="fill:#f1fa8c">Star my repositories.</text>
</g>

<g class="r" style="animation-delay:.9s">
<rect class="box" x="20" y="112" width="760" height="50" rx="12" style="stroke:#50fa7b;animation-delay:.4s"/>
<rect x="20" y="112" width="8" height="50" rx="4" fill="#50fa7b"/>
<text class="e" x="48" y="145" style="animation-delay:.3s">🍴</text>
<text x="90" y="143" style="fill:#50fa7b">Fork projects and contribute.</text>
</g>

<g class="r" style="animation-delay:1.4s">
<rect class="box" x="20" y="174" width="760" height="50" rx="12" style="stroke:#ff79c6;animation-delay:.8s"/>
<rect x="20" y="174" width="8" height="50" rx="4" fill="#ff79c6"/>
<text class="e" x="48" y="207" style="animation-delay:.6s">📢</text>
<text x="90" y="205" style="fill:#ff79c6">Share useful projects with others.</text>
</g>

<g class="r" style="animation-delay:1.9s">
<rect class="box" x="20" y="236" width="760" height="50" rx="12" style="stroke:#8be9fd;animation-delay:1.2s"/>
<rect x="20" y="236" width="8" height="50" rx="4" fill="#8be9fd"/>
<text class="e" x="48" y="269" style="animation-delay:.9s">🤝</text>
<text x="90" y="267" style="fill:#8be9fd">Support open-source development.</text>
</g>

<rect class="bg" x="20" y="316" width="760" height="94" rx="18"/>
<rect class="ban" x="20" y="316" width="760" height="94" rx="18"/>
<text class="tag" x="400" y="371">⚡ Code. Create. Innovate. Repeat. ⚡</text>

<circle class="sp" cx="80" cy="400" r="3" fill="#00FFD1" style="animation-delay:4.5s"/>
<circle class="sp" cx="220" cy="405" r="2.5" fill="#ff79c6" style="animation-delay:5.2s"/>
<circle class="sp" cx="400" cy="408" r="3" fill="#f1fa8c" style="animation-delay:4.9s"/>
<circle class="sp" cx="580" cy="404" r="2.5" fill="#a970ff" style="animation-delay:5.6s"/>
<circle class="sp" cx="720" cy="400" r="3" fill="#50fa7b" style="animation-delay:5s"/>
</svg>
